<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Site Planning — 100 Difficult MCQs</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17202a}
header{position:sticky;top:0;z-index:10;background:#16202a;color:#fff;padding:12px 14px;box-shadow:0 2px 8px #0002}
h1{font-size:20px;margin:0 0 5px}
.sub{font-size:12px;opacity:.8}
.progress{height:8px;background:#ffffff33;border-radius:5px;margin-top:10px;overflow:hidden}
#bar{height:100%;width:0;background:#55c878;transition:.2s}
.stats{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}
main{max-width:850px;margin:auto;padding:12px 10px 100px}
.section{font-size:16px;font-weight:bold;margin:18px 2px 8px;padding:10px 12px;background:#e5eaf0;border-left:4px solid #52687a;border-radius:5px}
.card{background:#fff;border-radius:9px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #0001}
.q{font-weight:bold;line-height:1.4;margin-bottom:11px}
.option{display:flex;align-items:flex-start;gap:9px;padding:10px 7px;border-radius:6px;border:1px solid #e2e6ea;margin:6px 0;cursor:pointer;line-height:1.35}
.option input{width:20px;height:20px;flex:none;margin:0}
.option.correct{background:#dff5e5;border-color:#38a169}
.option.wrong{background:#ffe1e1;border-color:#e05252}
.explain{display:none;margin-top:9px;padding:9px;background:#f5f7f9;border-radius:6px;font-size:13px}
#bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;gap:7px;justify-content:center;z-index:10}
button{border:0;border-radius:7px;padding:11px 14px;font-weight:bold;background:#263746;color:white}
button.secondary{background:#e8edf1;color:#17202a}
button.green{background:#238636}
#result{display:none;background:#fff;border-radius:10px;padding:15px;margin:14px 0;box-shadow:0 2px 7px #0002}
.score{font-size:28px;font-weight:bold}
.small{font-size:12px;color:#65717c}
</style>
</head>
<body>
<header>
<h1>Site Planning — 100 Difficult MCQs</h1>
<div class="sub">Site Analysis • Zoning • NBC • Circulation • Utilities • Drainage • Barrier-Free • Spatial Standards</div>
<div class="progress"><div id="bar"></div></div>
<div class="stats"><span id="answered">0 / 100 answered</span><span id="scoreTop">Score: —</span></div>
</header>

<main>
<div id="result"></div>
<div id="quiz"></div>
</main>

<div id="bottom">
<button onclick="checkAnswers()" class="green">Check Score</button>
<button onclick="resetQuiz()" class="secondary">Reset</button>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})">Top</button>
</div>

<script>

["Which combination is most appropriate for determining the suitability of a site for a large public building? 1. Existing vehicular access 2. Pedestrian catchment 3. Soil bearing capacity 4. Solar orientation 5. Existing utility infrastructure 6. Land ownership alone",["1, 2, 3 and 4 only","1, 2, 3, 4 and 5 only","2, 4 and 6 only","All six"],1],

["Which site characteristic has the greatest direct influence on the cost of earthwork?",["Vegetation type","Existing contour profile","Solar orientation","Wind direction"],1],

["A site receives intense afternoon solar radiation from the west. Which architectural response is generally most effective in reducing unwanted heat gain?",["Large unshaded west-facing glazing","External shading and reduction/control of west-facing openings","Increasing west-facing skylights","Using highly reflective internal flooring only"],1],

["The watershed of a site is best understood as:",["The area receiving water from an underground pipeline","The land area contributing runoff to a particular drainage outlet","The paved portion of a site","The area occupied by a water-storage tank"],1]
]],
["B. ZONING, REGULATIONS & NBC",[
["In development control, FAR/FSI primarily controls:",["Maximum building height only","Relationship between total permissible floor area and plot area","Minimum road width only","Percentage of landscaped area"],1],
["A plot has an area of 2,000 m² and permissible FAR is 1.5. The maximum permissible floor area, subject to other regulations, is:",["1,500 m²","2,000 m²","3,000 m²","3,500 m²"],2],
["A plot of 1,500 m² has a permissible ground coverage of 40%. The maximum ground-floor building footprint is:",["400 m²","500 m²","600 m²","750 m²"],2],
["Which statement best distinguishes ground coverage from FAR/FSI?",["Ground coverage controls total floor area; FAR controls footprint","Ground coverage relates to building footprint relative to plot area; FAR relates to total floor area","Both are identical measures","FAR applies only to residential buildings"],1],
["A building complies with permissible FAR but exceeds the permitted ground coverage. It is:",["Automatically compliant","Non-compliant with respect to ground coverage","Compliant because FAR supersedes coverage","Exempt if the building is low-rise"],1],
["Which of the following is not normally the purpose of building setbacks?",["Light and ventilation","Fire access and safety","Privacy and open space","Increasing permissible FAR automatically"],3],
["A building is proposed on a narrow urban plot. The designer wishes to maximise floor area while maintaining acceptable daylight and ventilation. Which approach is most appropriate?",["Ignore setbacks","Optimise the building envelope within applicable setbacks, coverage, height and FAR controls","Maximise coverage regardless of regulations","Increase height without checking height restrictions"],1],
["The National Building Code of India primarily serves as:",["A property taxation manual","A comprehensive model code providing guidelines for regulating building construction and related aspects","A land acquisition law","A municipal election regulation"],1],

]],
["C. SITE ACCESS & HORIZONTAL CIRCULATION",[
["The most desirable relationship between a major public building and its pedestrian entrance is generally:",["Entrance hidden behind service access","Clear, legible and direct pedestrian approach","Entrance accessible only through parking","Entrance located at the lowest drainage point"],1],

["A cul-de-sac is most appropriately used when:",["Through traffic is essential","A road needs to terminate without a through connection","Pedestrian movement must be eliminated","Fire access is unnecessary"],1],

]],
["D. VERTICAL CIRCULATION",[
["The principal distinction between a stair and a ramp in circulation planning is:",["Both are equivalent for all users","A ramp generally permits more continuous level change and can provide easier access for wheeled mobility","Stairs require no safety provisions","Ramps are used only outdoors"],1],
["The comfort of a stair is most directly influenced by the relationship between:",["Tread and riser dimensions","Window and sill height","Wall thickness and ceiling height","Column and beam dimensions"],0],
["A stair with a very high riser and very narrow tread is generally:",["More comfortable and safer","More difficult and potentially hazardous to use","Ideal for public buildings","Equivalent to a ramp"],1],
["A ramp has a rise of 1 m and a horizontal run of 12 m. Its approximate slope is:",["1:6","1:8","1:10","1:12"],3],
["A ramp designed for universal accessibility should incorporate: 1. Appropriate slope 2. Handrails where required 3. Landings 4. Adequate clear width 5. Slip-resistant surface",["1 and 2 only","1, 2 and 3 only","1, 2, 3 and 4 only","All five"],3],
["Why are intermediate landings required in long ramps?",["Only for decoration","To provide rest, manoeuvring and management of continuous level change","To increase the slope","To reduce clear width"],1],
["In a public building, vertical circulation should generally be:",["Located in inaccessible service areas only","Clearly identifiable and appropriately distributed according to movement demand","Restricted to one stair regardless of occupancy","Designed independently of fire safety"],1],
["An elevator is best understood in universal design as:",["A replacement for all emergency exits","An important accessible vertical circulation element, but not generally a substitute for required fire exits","A decorative feature","A service-only facility"],1],
["Which vertical circulation arrangement provides the strongest redundancy?",["One isolated staircase","Multiple appropriately located stairs/egress routes","One lift only","One spiral stair"],1],
["A building has a high concentration of users at the main entrance and upper floors. The most appropriate circulation planning approach is:",["Provide circulation capacity based on expected demand and occupancy","Minimise all vertical circulation","Locate stairs only in basement","Depend exclusively on escalators"],0]
]],
["E. UTILITIES & INFRASTRUCTURE",[
["Which utility should ideally be planned with consideration for gravity flow wherever feasible?",["Stormwater drainage","Electrical supply","Telecommunications","Street lighting"],0],

["Which sequence best represents a conventional potable-water supply system?",["Source → treatment/storage → distribution → point of use","Point of use → treatment → source","Sewer → reservoir → source","Storm drain → treatment → electrical grid"],0],
["The primary purpose of a water-storage tank in a building/site system is to:",["Increase sewage generation","Provide storage and help balance supply and demand","Replace stormwater drainage","Eliminate the need for distribution pipes"],1],
["Rainwater harvesting is primarily intended to:",["Increase surface runoff","Capture and utilise/recharge rainfall that would otherwise become runoff","Increase sewage generation","Replace all municipal water treatment"],1],
["A recharge pit is most closely associated with:",["Groundwater recharge","Electrical distribution","Solid-waste compaction","Fire escape"],0],
["Which site-planning measure can reduce stormwater runoff at source?",["Increasing impervious surface area","Permeable paving and infiltration-oriented landscape design","Removing vegetation","Paving all open spaces"],1],
["A decentralised wastewater treatment system is particularly useful when:",["All sites necessarily have identical municipal infrastructure","Local treatment/reuse is advantageous or central sewer connectivity is limited","No wastewater is generated","Stormwater is the only flow"],1],
["Which utility requires particular attention to electromagnetic/electrical safety and service access?",["Electrical distribution","Landscape irrigation only","Stormwater swale","Pedestrian paving"],0],
["In a large campus, locating the main electrical substation should consider:",["Only architectural appearance","Load distribution, access, safety, fire separation and maintenance","Only prevailing wind direction","Only landscape aesthetics"],1],
["The most appropriate reason for providing utility easements/service corridors is:",["To increase building density","To protect access and prevent incompatible construction over critical services","To eliminate maintenance","To increase pedestrian traffic"],1]
]],
["F. SITE GRADING & DRAINAGE",[
["The primary objective of site grading is to:",["Maximise excavation","Establish appropriate levels for buildings, access, drainage and landscape","Eliminate all existing contours","Increase building height"],1],
["A spot elevation indicates:",["The horizontal distance between contours","The elevation of a specific point relative to a reference datum","The soil type","The property ownership"],1],
["A contour line represents points having:",["Equal horizontal distance","Equal elevation","Equal slope","Equal rainfall"],1],
["If contour interval is 1 m and a site rises from contour 102 m to contour 108 m, the vertical difference is:",["4 m","5 m","6 m","8 m"],2],
["A ridge in contour interpretation generally represents:",["A low drainage depression","An elongated high ground from which water tends to drain away","A flat plateau only","An underground drain"],1],
["A valley is typically indicated by contour lines forming:",["V-shapes pointing uphill","Perfect circles only","Parallel straight lines","No elevation change"],0],
["When planning a road on sloping terrain, alignment roughly parallel to contours generally:",["Produces greater slope than an alignment perpendicular to contours","Can reduce longitudinal gradient","Always requires maximum cut","Eliminates drainage requirements"],1],
["The gradient of a surface is fundamentally expressed as:",["Horizontal distance divided by vertical rise","Vertical change relative to horizontal distance","Plot area divided by floor area","Building height divided by FAR"],1],
["A surface falling 1 m over a horizontal distance of 20 m has a gradient of approximately:",["2%","5%","10%","20%"],1],
["If a site is graded entirely flat without providing drainage slopes, the most likely consequence is:",["Faster drainage","Ponding and water accumulation","Improved infiltration automatically","Increased natural slope"],1],
["A swale is best described as:",["A raised building platform","A shallow landscape depression/channel designed to convey or manage runoff","An underground electrical conduit","A retaining wall"],1],
["A catch basin in site drainage primarily functions to:",["Collect surface runoff and direct it into the drainage system","Store potable water permanently","Increase road gradient","Replace a sewer treatment plant"],0],
["Which approach best follows sustainable site-drainage principles?",["Collect all runoff immediately and discharge it downstream","Follow a hierarchy of infiltration, detention/reuse and controlled discharge where feasible","Eliminate all vegetation","Maximise impervious surfaces"],1],
["A retaining wall on a sloping site should be accompanied by:",["No drainage provisions","Appropriate drainage behind/around the wall to manage hydrostatic pressure","Only decorative coping","Increased soil saturation"],1],
["Hydrostatic pressure behind a retaining wall can be reduced by:",["Preventing all drainage","Providing suitable drainage and relieving accumulated water","Increasing soil saturation","Eliminating weep/drainage provisions"],1]
]],
["G. BARRIER-FREE / UNIVERSAL DESIGN",[
["The central principle of barrier-free design is:",["Designing exclusively for wheelchair users","Designing environments so they can be accessed and used by the widest practical range of users","Eliminating all stairs from every building","Providing separate entrances for persons with disabilities"],1],
["A ramp may be technically present but still fail the principle of universal accessibility if:",["It has adequate width","It has excessive slope, lacks appropriate landings or creates unsafe movement conditions","It has a handrail","It connects two accessible levels"],1],

["H. SPATIAL STANDARDS & INTEGRATED APPLICATION",[
["Which of the following is the most important distinction between a dimensional standard and a performance standard?",["Dimensional standards are always optional","Dimensional standards prescribe measurable physical dimensions, while performance standards focus on required functional outcomes","Performance standards apply only to furniture","Dimensional standards apply only to landscape"],1],
["A designer provides the minimum dimensional clearance for a wheelchair but places a permanent obstruction immediately within the manoeuvring zone. The design:",["Is automatically accessible because the minimum dimension exists","Fails functionally because usable clearance and manoeuvring space have been compromised","Is acceptable if the obstruction is decorative","Becomes accessible by adding signage only"],1],

["Consider: 1. Separate pedestrian and service circulation where conflict is significant. 2. Preserve natural drainage wherever practicable. 3. Use site contours to reduce excessive cut-and-fill. 4. Coordinate utility corridors before hardscape construction. 5. Provide continuous accessible routes. 6. Locate emergency access so that it remains unobstructed. Which statement is most accurate?",["Only 1, 2 and 3 represent site planning","Only 4 and 5 represent site planning","All six are fundamental components of integrated site planning","Only 2 and 6 relate to regulations"],2]
]]
];

let flat=[], sectionCount=0;
questions.forEach(s=>s[1].forEach(q=>flat.push(q)));

const key=flat.map(q=>q[2]);
const quiz=document.getElementById("quiz");

let n=0;
questions.forEach(sec=>{
  const title=document.createElement("div"); title.className="section"; title.textContent=sec[0]; quiz.appendChild(title);
  sec[1].forEach((q)=>{
    n++;
    const card=document.createElement("div"); card.className="card"; card.id="card"+n;
    let html=`<div class="q">${n}. ${q[0]}</div>`;
    q[1].forEach((opt,i)=>{
      html+=`<label class="option" id="o${n}_${i}"><input type="radio" name="q${n}" value="${i}" onchange="updateProgress()"> <span>${String.fromCharCode(65+i)}. ${opt}</span></label>`;
    });
    html+=`<div class="explain" id="e${n}"></div>`;
    card.innerHTML=html; quiz.appendChild(card);
  });
});

function updateProgress(){
  let answered=0;
  for(let i=1;i<=100;i++) if(document.querySelector(`input[name=q${i}]:checked`)) answered++;
  document.getElementById("answered").textContent=`${answered} / 100 answered`;
  document.getElementById("bar").style.width=(answered)+"%";
}
function checkAnswers(){
  let score=0, attempted=0;
  for(let i=1;i<=100;i++){
    const selected=document.querySelector(`input[name=q${i}]:checked`);
    const card=document.getElementById("card"+i);
    card.querySelectorAll(".option").forEach(x=>x.classList.remove("correct","wrong"));
    if(selected){
      attempted++;
      const a=Number(selected.value);
      if(a===key[i-1]){score++;document.getElementById(`o${i}_${a}`).classList.add("correct")}
      else{document.getElementById(`o${i}_${a}`).classList.add("wrong");document.getElementById(`o${i}_${key[i-1]}`).classList.add("correct")}
    }
  }
  const pct=(score/100*100).toFixed(0);
  const r=document.getElementById("result");
  r.style.display="block";
  r.innerHTML=`<div class="score">${score} / 100</div><b>${pct}%</b><br><span class="small">Attempted: ${attempted} | Unattempted: ${100-attempted}</span>`;
  document.getElementById("scoreTop").textContent=`Score: ${score}/100`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function resetQuiz(){
  if(!confirm("Reset all answers?")) return;
  document.querySelectorAll("input[type=radio]").forEach(x=>x.checked=false);
  document.querySelectorAll(".option").forEach(x=>x.classList.remove("correct","wrong"));
  document.getElementById("result").style.display="none";
  document.getElementById("scoreTop").textContent="Score: —";
  updateProgress();
}
</script>
</body>
</html>
