<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>UPSC Architecture — Site Planning MCQs</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;color:#16181d}
.app{max-width:760px;margin:auto;padding:14px 14px 40px}
.header{position:sticky;top:0;z-index:10;background:#f4f5f7cc;backdrop-filter:blur(12px);padding:8px 0 12px}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:#666}
.progress{height:8px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:#111;width:1%;transition:.2s}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px;color:#555}
.card{background:white;border-radius:18px;padding:20px;margin-top:12px;box-shadow:0 2px 12px #0000000d}
.section{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#666;margin-bottom:10px}
.q{font-size:18px;line-height:1.5;font-weight:650;margin-bottom:17px}
.option{width:100%;border:1.5px solid #d7d9de;background:#fff;border-radius:13px;padding:14px;text-align:left;font-size:15px;line-height:1.4;margin:8px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.option:active{transform:scale(.99)}
.option.correct{border-color:#198754;background:#eaf7ef}
.option.wrong{border-color:#dc3545;background:#fff0f1}
.option.disabled{cursor:default}
.explain{display:none;border-radius:13px;padding:13px;margin-top:13px;font-size:14px;line-height:1.5}
.explain.show{display:block}
.explain.correct{background:#eaf7ef}
.explain.wrong{background:#fff0f1}
.actions{display:flex;gap:9px;margin-top:15px}
button.action{border:0;border-radius:12px;padding:12px 15px;background:#111;color:#fff;font-weight:650;cursor:pointer}
button.secondary{background:#e7e8eb;color:#111}
.result{display:none;text-align:center;padding:24px}
.score{font-size:46px;font-weight:800;margin:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:#f0f1f3;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#666}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{flex:1}
.note{font-size:12px;color:#777;margin-top:12px;text-align:center}
@media(max-width:480px){.app{padding:10px 10px 30px}.card{padding:16px}.q{font-size:17px}.option{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>UPSC Architecture — Difficult MCQs</h1>
    <div class="sub">Site Planning • 100 Questions • UPSC-style difficulty</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="toprow"><span id="counter">Question 1 of 100</span><span id="scoreTop">Score: 0</span></div>
  </div>

  <div id="quiz"></div>

  <div class="card result" id="result">
    <div class="section">Test Complete</div>
    <div class="score" id="finalScore">0/100</div>
    <div class="stats">
      <div class="stat"><b id="correctN">0</b><span>Correct</span></div>
      <div class="stat"><b id="wrongN">0</b><span>Wrong</span></div>
      <div class="stat"><b id="percentN">0%</b><span>Accuracy</span></div>
    </div>
    <button class="action" onclick="restart()">Restart Test</button>
    <div class="note">Designed around the difficult UPSC Architecture / Assistant Architect style benchmark.</div>
  </div>
</div>

<script>
const data = [
["Site Analysis","Consider the following statements regarding contour lines in site analysis:\\n\\n1. Contours cannot intersect one another under ordinary terrain conditions.\\n2. Closely spaced contours indicate a steeper slope than widely spaced contours.\\n3. Contours crossing a valley generally form a V whose apex points towards higher ground.\\n4. Contours crossing a ridge generally form a V whose apex points towards lower ground.\\n\\nWhich of the statements given above are correct?",["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"],0,"A valley contour forms a V pointing uphill; the ridge pattern points downhill. Thus 1, 2 and 3 are correct."],
["Site Analysis","A site has contours of 100 m, 102 m, 104 m, 106 m and 108 m. The horizontal distance between successive contours progressively decreases toward the 108 m contour. This most directly indicates:",["A concave slope rising towards 108 m","A convex slope rising towards 108 m","A uniformly inclined slope","A saddle condition"],1,"Contour spacing decreasing uphill indicates the slope is becoming steeper uphill — a convex profile."],
["Site Analysis","Consider the following statements about a saddle in terrain:\\n\\n1. It represents a low point between two higher elevations.\\n2. It may provide a natural route through otherwise elevated terrain.\\n3. Drainage from a saddle necessarily converges toward the saddle.\\n4. Saddle conditions are identifiable from the configuration of contours.\\n\\nWhich of the statements are correct?",["1 and 2 only","1, 2 and 4 only","2 and 3 only","1, 3 and 4 only"],1,"A saddle is a low pass between higher areas and can form a route. It is identifiable from contour configuration, but drainage does not necessarily converge to the saddle."],
["Site Analysis","For a proposed building on a sloping site, which approach generally minimises ecological disturbance and excessive earthwork?",["Levelling the entire site to one datum","Orienting the building perpendicular to all contours","Adapting the building form and floor levels to existing contours","Maximising excavation to create a large level platform"],2,"Adapting the building to the terrain reduces unnecessary cut-and-fill and preserves site characteristics."],
["Site Analysis","A site has a predominant slope of 1:20. The designer proposes a major pedestrian plaza requiring near-level conditions. Which intervention is most consistent with good site planning?",["Ignore existing contours and create a uniform cut platform","Introduce a sequence of terraces with controlled grade transitions","Increase the slope to accelerate surface drainage","Direct all runoff through the centre of the plaza"],1,"Terracing can create usable level areas while respecting topography and allowing controlled drainage."],
["Site Analysis","Which of the following is the most appropriate interpretation of solar access analysis at the site-planning stage?",["Determining only the annual average temperature","Studying the relationship between building mass, orientation, solar altitude and surrounding obstructions","Determining the structural orientation of the building exclusively","Calculating only the daylight factor inside rooms"],1,"Solar access is a spatial relationship involving orientation, sun position and obstruction by terrain/buildings/vegetation."],
["Site Analysis","Consider the following statements:\\n\\n1. A south-facing slope in the Northern Hemisphere generally receives greater solar exposure than a north-facing slope.\\n2. Solar exposure is influenced by slope orientation as well as slope angle.\\n3. A slope facing away from the equator is necessarily unsuitable for development.\\n\\nWhich are correct?",["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],1,"Aspect and slope affect solar exposure. But a non-equator-facing slope is not automatically unsuitable for development."],
["Site Analysis","A site analysis identifies a mature tree belt along the western edge of a plot. From a climate-responsive planning perspective, retaining the belt may be particularly useful because:",["Vegetation always eliminates the need for mechanical cooling","It can moderate solar exposure and microclimate along the site edge","Trees invariably increase wind speed","Vegetation prevents all forms of stormwater infiltration"],1,"Vegetation can provide shade, evapotranspirative cooling and wind modification, although effects depend on species and arrangement."],
["Site Analysis","Which combination would provide the most comprehensive physical site inventory?",["Land value, ownership and taxation","Contours, drainage, soil, vegetation, climate and existing built features","Building style, façade treatment and interior finishes","Construction cost, contractor availability and financing"],1,"A physical site inventory should capture topography, hydrology, soil, vegetation, climate and existing physical conditions."],
["Site Analysis","A site investigation reveals that groundwater lies very close to the natural ground level. Which design consideration becomes particularly important?",["Increasing basement depth without waterproofing","Ignoring subsoil conditions because groundwater does not affect foundations","Evaluating drainage, waterproofing, foundation implications and possible groundwater management","Increasing site imperviousness irrespective of drainage capacity"],2,"High groundwater can affect foundations, basements, waterproofing, drainage and construction feasibility."],
["Site Analysis","Which of the following is the least appropriate use of a slope analysis map?",["Identifying areas suitable for different development intensities","Locating potentially problematic steep terrain","Determining areas requiring special grading treatment","Determining exact structural member sizes"],3,"Slope analysis informs site planning and grading, not exact structural member sizing."],
["Site Analysis","In a site suitability analysis, a GIS-based weighted overlay primarily allows the planner to:",["Convert every spatial variable into a contour map","Combine multiple spatial criteria according to assigned importance","Eliminate the need for field surveys","Generate structural calculations automatically"],1,"Weighted overlay combines spatial criteria using assigned weights to produce a suitability surface."],
["Site Analysis","Consider the following site characteristics:\\n\\n1. High ecological sensitivity\\n2. Low accessibility\\n3. High flood susceptibility\\n4. High development pressure\\n\\nWhich factor should generally receive the strongest exclusionary weight in an environmentally sensitive site suitability analysis?",["Development pressure","Accessibility","Ecological sensitivity","Land value"],2,"Ecological sensitivity is a direct environmental constraint; development pressure and land value do not override it."],
["Site Analysis","A desire line in site planning is best understood as:",["A legally notified road alignment","The naturally preferred route used or likely to be used by pedestrians","A contour line indicating the shortest drainage path","A fire-tender access route"],1,"A desire line represents observed or anticipated preferred movement, particularly pedestrian movement."],
["Site Analysis","Which site-planning relationship is most appropriate?",["Land-use planning should precede understanding of site constraints","Site analysis should identify constraints and opportunities before finalising spatial organisation","Site analysis is primarily an architectural aesthetics exercise","Site analysis becomes unnecessary once a master plan is available"],1,"Site analysis establishes the opportunities and constraints that should inform zoning, programme and spatial organisation."],

["Zoning & Regulations","Consider the following statements regarding FAR/FSI:\\n\\n1. It expresses a relationship between permissible floor area and plot area.\\n2. Increasing FAR necessarily means increasing ground coverage.\\n3. A higher FAR can be achieved through vertical development without proportionally increasing ground coverage.\\n\\nWhich are correct?",["1 only","1 and 3 only","2 and 3 only","1, 2 and 3"],1,"FAR relates total permissible floor area to plot area. Higher FAR can be achieved vertically, so it does not necessarily increase footprint."],
["Zoning & Regulations","A plot has an area of 2,000 m² and permissible FAR of 2.0. Ignoring exclusions and special provisions, the maximum permissible floor area is:",["1,000 m²","2,000 m²","4,000 m²","6,000 m²"],2,"FAR = total floor area / plot area. Therefore 2.0 × 2,000 = 4,000 m²."],
["Zoning & Regulations","Consider a development with: Plot area = 5,000 m²; Ground coverage = 40%; FAR = 1.6. Which statement is correct?",["Maximum ground-floor footprint is 2,000 m² and total FAR area is 8,000 m²","Maximum ground-floor footprint is 2,000 m² and total FAR area is 5,000 m²","Maximum ground-floor footprint is 3,200 m² and total FAR area is 8,000 m²","Maximum ground-floor footprint is 8,000 m²"],0,"40% of 5,000 = 2,000 m² footprint. FAR 1.6 gives 8,000 m² total floor area."],
["Zoning & Regulations","Which statement most accurately distinguishes ground coverage from FAR?",["Both measure exactly the same thing","Ground coverage concerns the building footprint, whereas FAR concerns aggregate floor area relative to plot area","Ground coverage is calculated using total floor area","FAR applies only to the ground floor"],1,"Coverage controls the footprint; FAR/FSI controls aggregate floor area relative to plot area."],
["Zoning & Regulations","Consider the following statements regarding zoning:\\n\\n1. Zoning can regulate land use.\\n2. Zoning can establish development intensity.\\n3. Zoning necessarily determines architectural style.\\n4. Zoning can establish spatial relationships between incompatible uses.\\n\\nWhich are correct?",["1 and 2 only","1, 2 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"],1,"Zoning regulates use and intensity and can separate incompatible uses; it does not necessarily dictate architectural style."],
["Zoning & Regulations","A mixed-use development places a noisy workshop directly adjacent to a quiet residential courtyard. Which planning principle has most clearly been violated?",["Functional compatibility","Structural hierarchy","Axial symmetry","Visual balance"],0,"Land uses with conflicting noise and environmental impacts require compatibility planning or buffering."],
["Zoning & Regulations","Which is the strongest rationale for establishing buffer zones between incompatible land uses?",["To maximise FAR","To mitigate adverse externalities such as noise, pollution and incompatible movement","To eliminate all pedestrian movement","To reduce the need for infrastructure"],1,"Buffers mitigate externalities and can provide spatial transition between incompatible uses."],
["Zoning & Regulations","A planner proposes to satisfy a setback requirement by measuring the distance from the plot boundary to a projecting balcony, although the applicable regulation defines the setback with reference to the main building line. The primary issue is:",["FAR calculation","Interpretation and application of the controlling development regulation","Soil bearing capacity","Fire-load calculation"],1,"The key issue is applying the exact definition and measurement basis prescribed by the controlling regulation."],
["Zoning & Regulations","Consider the following statements about development regulations:\\n\\n1. Setbacks may help provide light and ventilation.\\n2. Setbacks may facilitate fire access and separation.\\n3. Setbacks always reduce permissible FAR.\\n4. Setbacks may contribute to privacy between buildings.\\n\\nWhich are correct?",["1 and 2 only","1, 2 and 4 only","2 and 3 only","1, 2, 3 and 4"],1,"Setbacks can serve light, ventilation, safety and privacy objectives. They do not universally reduce FAR because regulations may define FAR independently."],
["Zoning & Regulations","The principal planning logic behind regulating building height in relation to road width includes:",["Only aesthetic considerations","Relationship between urban canyon geometry, access, light, ventilation and emergency movement","Elimination of all high-rise development","Maximising plot coverage"],1,"Height-to-road relationships can influence light, ventilation, emergency access and the scale of the street canyon."],
["Zoning & Regulations","A regulation permits a certain FAR but limits building height because of an airport obstacle limitation surface. This illustrates:",["FAR being universally superior to height controls","The coexistence of different regulatory controls serving different objectives","Ground coverage regulation","Heritage conservation zoning only"],1,"Different controls address different constraints; airport safety can independently restrict height."],
["Zoning & Regulations","Which of the following is most likely to require special consideration in airport-influenced development control?",["Only interior colour","Building height and obstruction limitation","Furniture layout","Flooring pattern"],1,"Airport environments can impose obstacle/height restrictions and other aviation-related safeguards."],
["Zoning & Regulations","Consider the following statements about occupancy classification:\\n\\n1. It categorises buildings according to their principal use/occupancy characteristics.\\n2. It is relevant to life-safety provisions.\\n3. It has no relationship with fire-safety requirements.\\n\\nWhich is correct?",["1 only","2 only","1 and 2 only","1, 2 and 3"],2,"Occupancy/use classification affects life-safety and fire provisions; statement 3 is false."],
["Zoning & Regulations","A building contains an assembly space with a large number of occupants. Compared with a low-occupancy building, planning should give particular attention to:",["Egress capacity and evacuation","Reducing exits","Eliminating fire separation","Increasing dead-end corridors"],0,"Large occupant loads demand careful egress capacity, exit provision and evacuation planning."],
["Zoning & Regulations","The primary reason for avoiding single-point dependence in a large public building's evacuation strategy is:",["It increases daylight","Failure or blockage of one route can compromise evacuation","It increases FAR","It reduces acoustic absorption"],1,"Multiple viable escape paths provide resilience if one route is blocked by fire, smoke or obstruction."],
["Zoning & Regulations","Which planning decision most directly demonstrates risk-sensitive zoning?",["Locating critical emergency facilities in areas with high flood susceptibility","Restricting vulnerable uses in high-risk hazard zones","Maximising construction in natural drainage channels","Increasing imperviousness in floodplains"],1,"Risk-sensitive zoning restricts vulnerable development in areas where hazards could cause disproportionate consequences."],
["Zoning & Regulations","A site lies partly within a protected heritage precinct. Which approach is most appropriate?",["Apply only conventional FAR rules","Ignore heritage controls if FAR is permissible","Integrate applicable heritage restrictions with development controls","Automatically prohibit every form of development"],2,"Heritage controls and general development controls need to be read together; protection does not necessarily mean total prohibition."],

["Access & Circulation","A properly planned site circulation hierarchy should generally distinguish between:",["Primary, secondary and tertiary movement systems","Only cars and buses","Only public and private buildings","Structure and ornament"],0,"Hierarchical circulation distinguishes major, local and access-level movement and helps organise traffic."],
["Access & Circulation","Which circulation arrangement most effectively reduces pedestrian–vehicular conflict?",["Mixing all movement at every point","Clearly defined pedestrian paths with controlled vehicle crossings","Locating pedestrian paths within vehicle turning radii","Eliminating pedestrian routes"],1,"Separating or carefully managing crossing points reduces conflicts while preserving connectivity."],
["Access & Circulation","A cul-de-sac is most appropriately described as:",["A road with continuous through movement at both ends","A dead-end street generally terminating in a turning arrangement","A pedestrian-only street","A service road along a highway median"],1,"A cul-de-sac is a dead-end street requiring an appropriate turning arrangement."],
["Access & Circulation","The primary functional purpose of a turning head at the end of a dead-end road is to:",["Increase road gradient","Allow vehicles to reverse direction safely","Increase pedestrian density","Reduce drainage"],1,"Turning heads provide the manoeuvring space needed to turn vehicles without unsafe reversing."],
["Access & Circulation","For fire-tender access, the most important site-planning consideration is:",["Decorative paving","Adequate unobstructed access, geometry and load-bearing capacity","Maximum landscaping along the route","Minimising turning space"],1,"Fire access must remain physically usable, structurally adequate and geometrically suitable for emergency vehicles."],
["Access & Circulation","A road with adequate nominal width nevertheless cannot accommodate a fire tender because parked vehicles occupy the turning envelope. This is fundamentally a problem of:",["Effective operational clearance","FAR","Plot ratio","Soil classification"],0,"Nominal width is insufficient if actual obstructions prevent the vehicle from manoeuvring."],
["Access & Circulation","Consider the following statements:\\n\\n1. A wider road is always safer for pedestrians.\\n2. Vehicle speed influences pedestrian safety.\\n3. Crossing distance affects pedestrian exposure to traffic.\\n4. Traffic calming can reduce vehicle speeds.\\n\\nWhich are correct?",["1 and 2 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"],1,"Speed, crossing distance and traffic calming matter; wider roads can sometimes increase crossing exposure rather than automatically improving safety."],
["Access & Circulation","Which intervention is most directly associated with traffic calming?",["Increasing straight-line sight distance for speeding","Raised crossings and geometric measures that encourage lower speeds","Increasing lane width","Removing pedestrian crossings"],1,"Traffic calming uses geometric and operational measures to reduce speeds and improve safety."],
["Access & Circulation","A pedestrian route through a campus follows the shortest geometric path but is rarely used because it is exposed, poorly shaded and visually unpleasant. This demonstrates the importance of:",["Only geometric distance","Perceived comfort and environmental quality in movement behaviour","FAR","Structural grid"],1,"Actual movement is influenced by comfort, shade, safety, legibility and environmental quality, not only shortest distance."],
["Access & Circulation","Which of the following is the most appropriate principle for separating service traffic from public arrival areas?",["Shared movement at all times","Functional segregation with controlled points of interaction","Elimination of service access","Placing service vehicles at the principal pedestrian entrance"],1,"Service and public movements should be separated where feasible, with controlled interaction points."],
["Access & Circulation","A ramp has to overcome a large vertical difference. Which design strategy is generally most appropriate?",["Increase slope indefinitely","Use a compliant gradient with intermediate landings as required","Eliminate handrails","Reduce width to zero at landings"],1,"Long level changes should be resolved with acceptable gradients and appropriate landings, handrails and clearances."],
["Access & Circulation","In a multi-level building, a circulation system with a central stair and lift core primarily represents:",["Vertical circulation organisation","Site drainage","Zoning separation","Ecological infrastructure"],0,"Stairs and lifts form the vertical circulation system connecting building levels."],
["Access & Circulation","A desire line crossing a planned vehicular road should be addressed primarily by:",["Blocking pedestrian movement","Providing a safe and legible crossing at an appropriate location","Ignoring actual pedestrian behaviour","Increasing road speed"],1,"The design should respond to observed/preferred pedestrian movement with safe crossings."],
["Access & Circulation","Which factor should be considered when locating a pedestrian entrance to a major public building?",["Relationship to arrival routes and pedestrian desire lines","Only orientation of structural columns","Only façade symmetry","Only maximum FAR"],0,"Entrances should align with actual approach routes, visibility, accessibility and pedestrian movement."],
["Access & Circulation","The most robust circulation planning approach for a large institutional campus is:",["One undifferentiated movement network","Hierarchical integration of pedestrian, cycle, public transport, service and private vehicle movement","Complete dependence on private vehicles","Complete elimination of service vehicles"],1,"A resilient campus movement system integrates modes while maintaining hierarchy and appropriate segregation."],

["Utilities & Infrastructure","In site planning, utility corridors are best located so that they:",["Prevent future maintenance access","Provide logical, accessible routes for installation, inspection and maintenance","Always pass through building foundations","Coincide with all pedestrian desire lines"],1,"Utility planning should account for installation, access, maintenance, replacement and future expansion."],
["Utilities & Infrastructure","Consider the following statements regarding water supply:\\n\\n1. Water demand varies with land use and occupancy.\\n2. Peak demand can differ from average daily demand.\\n3. Storage requirements are unrelated to demand variation.\\n\\nWhich are correct?",["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],1,"Demand varies with use and time. Storage and system sizing are related to these variations."],
["Utilities & Infrastructure","A gravity-based sewer system is generally advantageous where:",["Terrain allows appropriate gradients","No elevation difference exists","All pipes must be perfectly horizontal","Pumping is mandatory throughout"],0,"Gravity conveyance is energy-efficient where terrain allows adequate hydraulic gradient."],
["Utilities & Infrastructure","Which condition most directly threatens the performance of a gravity sewer?",["Proper gradient","Inadequate gradient leading to sedimentation","Appropriate manhole spacing","Proper alignment"],1,"Insufficient gradient can reduce self-cleansing velocity and encourage solids deposition."],
["Utilities & Infrastructure","A separate sewer system generally means:",["Separate pipes for potable and non-potable water","Separate conveyance of sanitary sewage and stormwater","Separate pipes for hot and cold water","Separate pipes for each building occupant"],1,"Separate systems convey sanitary sewage and stormwater independently."],
["Utilities & Infrastructure","Which statement best describes the advantage of separating stormwater from sanitary sewage?",["It necessarily eliminates all flooding","It can reduce unnecessary hydraulic loading on sewage treatment systems","It eliminates the need for drainage","It makes infiltration impossible"],1,"Separating stormwater avoids unnecessarily loading sanitary sewers and treatment plants during rainfall."],
["Utilities & Infrastructure","A site is being planned using rainwater harvesting. Which sequence is most logical?",["Collection → conveyance → filtration/treatment as appropriate → storage/recharge","Storage → roof construction → collection","Sewage → collection → potable distribution","Drainage → demolition → recharge"],0,"Rainwater systems collect runoff, convey it, provide appropriate pretreatment and then store or recharge."],
["Utilities & Infrastructure","Which condition is most favourable for groundwater recharge through infiltration?",["Completely impervious surface","Suitable permeable ground with appropriate recharge design","Contaminated industrial runoff","Direct discharge of untreated sewage"],1,"Recharge requires suitable hydrogeological conditions and clean/manageable source water."],
["Utilities & Infrastructure","A decentralised wastewater treatment approach can be particularly advantageous when:",["Every site must be connected to a distant central plant regardless of context","Local treatment and reuse can reduce conveyance requirements","No treatment is required","Wastewater is discharged directly into groundwater"],1,"Decentralised systems can reduce long conveyance and facilitate local treatment/reuse when context permits."],
["Utilities & Infrastructure","Which of the following represents a nature-based stormwater management approach?",["Completely channelising all runoff in concrete drains","Bioswales and infiltration landscapes","Eliminating all vegetation","Increasing impervious coverage"],1,"Bioswales and infiltration landscapes use soil and vegetation to slow, filter and infiltrate runoff."],
["Utilities & Infrastructure","A bioswale primarily functions to:",["Increase vehicle speed","Convey, slow and help filter stormwater through vegetated soil systems","Store potable water under pressure","Carry electrical cables"],1,"Bioswales are shallow vegetated drainage features designed to manage runoff."],
["Utilities & Infrastructure","Which is the most appropriate principle for solid-waste infrastructure at a large campus?",["Collection points should be inaccessible to service vehicles","Waste handling should consider segregation, collection logistics, hygiene and access","All waste should be mixed before collection","Waste storage should always be located at the main entrance"],1,"Waste infrastructure must support segregation, safe storage, efficient collection and hygienic operation."],
["Utilities & Infrastructure","Utility crossings beneath major roads should preferably be planned to:",["Make future maintenance impossible","Minimise disruption and provide appropriate protection/access for maintenance","Cross foundations wherever possible","Eliminate utility mapping"],1,"Crossings should be coordinated and protected so repairs do not cause avoidable disruption."],
["Utilities & Infrastructure","A utility network is planned without considering future expansion. The most significant planning deficiency is:",["Lack of flexibility and provision for future capacity","Excessive pedestrian priority","Excessive daylight","Architectural symmetry"],0,"Infrastructure should anticipate phasing, growth, replacement and additional demand."],
["Utilities & Infrastructure","Which infrastructure strategy best represents integrated infrastructure planning?",["Designing water, sewage, drainage, power and roads independently","Coordinating utility corridors, road hierarchy, drainage and future development phases","Installing utilities after all buildings are completed","Locating every utility randomly according to shortest distance"],1,"Integrated infrastructure coordinates networks spatially and temporally with development and access."],

["Site Grading & Drainage","The primary objective of site grading is to:",["Maximise excavation","Establish appropriate levels and slopes for functional use, drainage and stability","Eliminate all natural topography","Increase stormwater velocity everywhere"],1,"Grading establishes usable levels and controlled slopes while managing runoff and stability."],
["Site Grading & Drainage","A site has a natural slope directed toward a proposed building entrance. Which is the most appropriate response?",["Allow uncontrolled runoff through the entrance","Regrade or intercept runoff so that drainage is directed safely away","Increase imperviousness at the entrance","Block all drainage outlets"],1,"Building entries should be protected from uncontrolled surface runoff through grading and drainage measures."],
["Site Grading & Drainage","A swale is best described as:",["A raised structural beam","A shallow landscaped depression used to convey/manage surface runoff","A deep underground sewer","A retaining wall"],1,"A swale is a shallow open depression, often vegetated, used for runoff conveyance and treatment."],
["Site Grading & Drainage","Consider the following statements:\\n\\n1. Surface drainage generally depends on adequate slope.\\n2. Excessively steep drainage channels may create erosion problems.\\n3. The fastest possible runoff is always the most desirable design objective.\\n\\nWhich are correct?",["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],1,"Adequate slope is needed, but excessively rapid flow can cause erosion. The goal is controlled, not maximum-speed runoff."],
["Site Grading & Drainage","A site has high runoff during intense rainfall despite having adequate drainage channels. One possible planning cause is:",["Excessive infiltration","Excessive impervious surface and reduced infiltration","Too much vegetation","Excessive groundwater recharge"],1,"Imperviousness increases runoff volume and peak flow by reducing infiltration."],
["Site Grading & Drainage","Which of the following is most likely to reduce peak stormwater runoff from a developed site?",["Increasing imperviousness","Increasing detention, infiltration and permeable surfaces where feasible","Removing all vegetation","Accelerating runoff directly to the downstream boundary"],1,"Detention, infiltration and permeable surfaces can reduce and delay peak discharge."],
["Site Grading & Drainage","The term time of concentration in watershed/drainage analysis broadly refers to:",["Time required for construction of a drain","Time for runoff from the hydraulically most distant point to reach the outlet","Time required to excavate a pond","Duration of groundwater recharge only"],1,"Time of concentration describes the travel time from the hydraulically most distant contributing point to the outlet."],
["Site Grading & Drainage","A detention basin differs conceptually from a simple drainage channel because it:",["Has no relationship with stormwater","Temporarily stores runoff and controls its release","Eliminates rainfall","Functions exclusively as a sewer"],1,"Detention temporarily stores runoff and attenuates peak discharge by controlled release."],
["Site Grading & Drainage","Which grading condition is generally undesirable immediately adjacent to a building?",["Positive drainage away from the building","Ponding against the foundation","Controlled surface runoff","Properly designed drainage collection"],1,"Water ponding at foundations increases moisture and infiltration risks."],
["Site Grading & Drainage","A retaining wall becomes necessary primarily when:",["A difference in ground elevation needs to be retained safely","All sites are perfectly flat","Drainage is unnecessary","A building has no foundation"],0,"Retaining structures hold back soil where a significant elevation difference cannot be achieved safely by slope alone."],
["Site Grading & Drainage","Which of the following most directly affects the stability of a retaining wall?",["Lateral earth pressure and drainage conditions","Interior paint colour","Façade ornamentation","Window-to-wall ratio only"],0,"Lateral soil/water pressure and foundation/geotechnical conditions are central to retaining-wall stability."],
["Site Grading & Drainage","Why is drainage behind a retaining wall important?",["To increase hydrostatic pressure","To reduce undesirable water pressure buildup behind the wall","To eliminate soil weight","To increase soil saturation"],1,"Water pressure can substantially increase lateral loading; drainage helps control it."],
["Site Grading & Drainage","A cut-and-fill balance strategy in grading aims primarily to:",["Maximise transportation of excavated material off site","Balance excavation and embankment quantities where feasible","Eliminate contour analysis","Increase building height"],1,"Balancing cut and fill can reduce haulage, disposal and import of soil, subject to geotechnical suitability."],
["Site Grading & Drainage","Which statement about grading contours is most appropriate?",["Proposed contours should be developed independently of existing terrain","Proposed grading should respond to existing contours, drainage objectives and development requirements","Existing contours are irrelevant after zoning","Every site should have perfectly horizontal contours"],1,"Grading should reconcile existing topography with development and drainage objectives."],
["Site Grading & Drainage","A site is located downstream of a large impervious development. Which intervention is most useful for reducing downstream peak discharge from the new site?",["Direct discharge without attenuation","On-site detention and infiltration measures where feasible","Increasing roof runoff velocity","Eliminating landscape areas"],1,"Detention and infiltration can reduce and delay discharge, reducing contribution to downstream peak flows."],

["Barrier-Free Design","The fundamental objective of universal design is:",["Designing exclusively for wheelchair users","Creating environments usable by the widest possible range of people without unnecessary adaptation","Separating disabled users from other users","Providing only specialised entrances"],1,"Universal design seeks broad usability by people with diverse abilities, ages and circumstances."],

["Barrier-Free Design","An accessible parking bay is provided, but the route between the parking area and entrance is blocked by a kerb without an appropriate transition. This means:",["Parking accessibility alone is sufficient","The overall accessible route remains deficient","FAR has been exceeded","The building is automatically universally designed"],1,"Accessible parking is useful only if the path from parking to the accessible entrance is itself usable."],

["Barrier-Free Design","Which design approach is most consistent with universal design?",["A separate entrance for persons with disabilities wherever possible","A common, dignified entrance usable by diverse users where feasible","A service entrance designated for wheelchair users","Restricting accessible facilities to ground-floor rooms"],1,"Universal design favours integrated, dignified access rather than unnecessary segregation."],

let i=0, score=0, answered=0, results=[];
function render(){
  const q=data[i];
  document.getElementById("counter").textContent=`Question ${i+1} of ${data.length}`;
  document.getElementById("scoreTop").textContent=`Score: ${score}`;
  document.getElementById("bar").style.width=((i)/data.length*100)+"%";
  const root=document.getElementById("quiz");
  root.innerHTML="";
  const card=document.createElement("div"); card.className="card";
  const sec=document.createElement("div"); sec.className="section"; sec.textContent=q[0];
  const qt=document.createElement("div"); qt.className="q"; qt.innerHTML=q[1].replace(/\n/g,"<br>");
  card.append(sec,qt);
  const letters=["A","B","C","D"];
  q[2].forEach((text,k)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<b>${letters[k]}.</b> ${text}`;
    b.onclick=()=>answer(k,b,card);
    card.appendChild(b);
  });
  const exp=document.createElement("div"); exp.className="explain"; exp.id="exp";
  card.appendChild(exp);
  const nav=document.createElement("div"); nav.className="nav";
  if(i>0){const prev=document.createElement("button");prev.className="action secondary";prev.textContent="← Previous";prev.onclick=()=>{i--;render()};nav.appendChild(prev)}
  else nav.appendChild(document.createElement("div"));
  const next=document.createElement("button"); next.className="action"; next.textContent=i===data.length-1?"Finish Test":"Next →"; next.disabled=true; next.onclick=()=>{if(i<data.length-1){i++;render()}else finish()};
  nav.appendChild(next); card.appendChild(nav);
  root.appendChild(card);
}
function answer(k,btn,card){
  const buttons=[...card.querySelectorAll(".option")];
  if(buttons.some(x=>x.classList.contains("disabled"))) return;
  buttons.forEach(x=>x.classList.add("disabled"));
  const correct=data[i][3];
  if(k===correct){btn.classList.add("correct");score++;results[i]=true}
  else {btn.classList.add("wrong");buttons[correct].classList.add("correct");results[i]=false}
  answered++;
  const exp=card.querySelector("#exp");
  exp.className="explain show "+(k===correct?"correct":"wrong");
  exp.innerHTML=(k===correct?"<b>✓ Correct.</b> ":"<b>✗ Incorrect.</b> ")+data[i][4];
  card.querySelector(".nav button:last-child").disabled=false;
  document.getElementById("scoreTop").textContent=`Score: ${score}`;
}
function finish(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("finalScore").textContent=`${score}/${data.length}`;
  document.getElementById("correctN").textContent=score;
  document.getElementById("wrongN").textContent=data.length-score;
  document.getElementById("percentN").textContent=Math.round(score/data.length*100)+"%";
  document.getElementById("bar").style.width="100%";
  document.getElementById("counter").textContent="Test complete";
}
function restart(){i=0;score=0;answered=0;results=[];document.getElementById("quiz").style.display="block";document.getElementById("result").style.display="none";render();window.scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body>
</html>
